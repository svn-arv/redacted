[package]
name = "redacted-cli"
version = "1.1.0"
edition = "2024"
description = "Claude Code PostToolUse hook that scrubs secrets from tool output"
license = "MIT"
repository = "https://github.com/svn-arv/redacted"

[[bin]]
name = "redacted"
path = "src/main.rs"

[dependencies]
redacted-core = { version = "=1.1.0", git = "https://github.com/rmaw22/redacted-core.git", rev = "42c08185d9542d244c5f7816b913b46963498cf4" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
inquire = "0.9"

[dev-dependencies]
redacted-core = { version = "=1.1.0", git = "https://github.com/rmaw22/redacted-core.git", rev = "42c08185d9542d244c5f7816b913b46963498cf4", features = ["test-support"] }

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
