# engine.example.yml — detection rules. Copy to ~/.config/redacted/engine.yml
# (global) or .redacted.engine.yml (project root). This file tunes WHAT counts as
# a secret; operational policy, learned secrets and the heuristic live in
# config.yaml instead. `keywords` and `heuristic` from 0.7 are ignored here.

# Extra value-shape allow rows: a candidate whose value (key=value) or whole
# match (value-only) matches one is never redacted.
allow_values:
  - '^svc_[A-Za-z0-9]+$'

# Extra vendor patterns, run after the built-in ones.
patterns:
  - name: openai_key
    regex: 'sk-proj-[A-Za-z0-9_-]{20,}'
