version: 2

before:
  hooks:
    - cargo test --locked

# Musl on Linux keeps the binaries static, as the Go CGO_ENABLED=0 builds were.
builds:
  - builder: rust
    binary: redacted
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-pc-windows-gnu

archives:
  - formats:
      - tar.gz
    name_template: "redacted_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: svn-arv
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/svn-arv/redacted"
    description: "Claude Code PostToolUse hook that scrubs secrets from tool output"
    license: "MIT"
    install: |
      bin.install "redacted"
    test: |
      system "#{bin}/redacted", "--help"

release:
  github:
    owner: svn-arv
    name: redacted
  replace_existing_artifacts: true
